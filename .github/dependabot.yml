---
version: 2
multi-ecosystem-groups:
  infra3:
    schedule:
      interval: "weekly"

updates:

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["nginx", "redis", "postgres"]
    multi-ecosystem-group: "infra3"
    ignore: 
      - dependency-name: "amdocs/platform/amaiz-framework-sdk"

  - package-ecosystem: "helm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "infra3"
