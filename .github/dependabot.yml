---
version: 2
multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Disable ALL non-security version updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    pull-request-branch-name:
      separator: "-"
      
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "stg"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Disable ALL non-security version updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "docker"
    directory: "/"
    multi-ecosystem-group: "infrastructure"
    groups:
      docker:
        patterns:
          - "nginx"
          - "redis"
          - "postgres"

  - package-ecosystem: "helm"
    directory: "/"
    multi-ecosystem-group: "infrastructure"
    patterns:
      - "*"
    groups:
      helm-charts:
        patterns:
          - "*"